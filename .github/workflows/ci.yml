# Runs on every pull request and on every push to main.
# Order: cheapest checks first, so a formatting mistake fails in seconds, not minutes.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# The test-report step writes a check and a comment on the pull request.
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install the locked dependencies
        run: uv sync --frozen

      - name: Lint and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      # Unit tests and in-process API tests. Smoke tests are excluded by default (see pyproject.toml).
      - name: Fast tests
        run: uv run pytest --junitxml=reports/fast.xml

      # From here on the server runs the way a deployment would: from the built image.
      # --wait blocks until the container's health check (GET /ready) passes.
      - name: Build and start the container
        run: docker compose up --build --wait

      - name: Smoke tests against the container
        run: uv run pytest -m smoke --junitxml=reports/smoke.xml

      # The runner is deleted after the job, so the server log must be printed now or it is lost.
      - name: Server log (only on failure)
        if: failure()
        run: docker compose logs

      - name: Stop the container
        if: always()
        run: docker compose down

      # Publishes passed/failed/skipped counts and each failure message on the pull request.
      - name: Publish the test report
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: reports/*.xml

      - name: Keep the raw reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
