# Runs on every pull request and on every push to main.
# Order: cheapest checks first, so a formatting mistake fails in seconds, not minutes.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# The test-report steps write a check and a comment on the pull request.
# actions: read lets the ui job download earlier runs' reports for the dashboard.
permissions:
  contents: read
  checks: write
  pull-requests: write
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install the locked dependencies
        run: uv sync --frozen

      - name: Lint and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      # Unit, contract and in-process API tests. Smoke and integration tests are excluded by
      # default (see pyproject.toml) because they need the container.
      - name: Fast tests
        run: uv run pytest --junitxml=reports/fast.xml

      # From here on the server runs the way a deployment would: from the built image.
      # --wait blocks until the container's health check (GET /ready) passes.
      - name: Build and start the container
        run: docker compose up --build --wait

      - name: Smoke and integration tests against the container
        run: uv run pytest -m "smoke or integration" --junitxml=reports/live.xml

      # The runner is deleted after the job, so the server log must be printed now or it is lost.
      - name: Server log (only on failure)
        if: failure()
        run: docker compose logs

      - name: Stop the container
        if: always()
        run: docker compose down

      # Publishes passed/failed/skipped counts and each failure message on the pull request.
      - name: Publish the test report
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: reports/*.xml

      - name: Keep the raw reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/

  # Browser tests of the quality dashboard. A separate job, so it runs in parallel with `test`
  # and a dashboard problem never hides a product test result (or the other way round).
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install the locked dependencies
        run: uv sync --frozen

      # Chromium plus the Linux libraries it needs. The runner starts empty every time.
      - name: Install the browser
        run: uv run playwright install --with-deps chromium

      - name: Start Postgres and Grafana
        run: docker compose -f compose.metrics.yaml up -d --wait

      # The same loader as on a laptop: CI history and test reports from the GitHub API.
      - name: Load CI history and bugs into the dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python scripts/load_quality_metrics.py --fetch --limit 100 \
            | docker compose -f compose.metrics.yaml exec -T postgres \
                psql -q -v ON_ERROR_STOP=1 -U quality -d quality

      # Keep a trace and a screenshot only for tests that fail: that is what someone debugs.
      - name: Browser tests
        run: >
          uv run pytest -m ui --junitxml=reports/ui.xml
          --tracing retain-on-failure --screenshot only-on-failure

      - name: Grafana log (only on failure)
        if: failure()
        run: docker compose -f compose.metrics.yaml logs grafana

      - name: Stop the dashboard
        if: always()
        run: docker compose -f compose.metrics.yaml down -v

      # Its own check and comment, so it does not overwrite the product test report.
      - name: Publish the UI test report
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: reports/ui.xml
          check_name: UI test results
          comment_title: UI test results

      # Open a trace with: uv run playwright show-trace trace.zip
      - name: Keep traces and screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
