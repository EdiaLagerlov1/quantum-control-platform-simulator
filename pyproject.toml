[project]
name = "quantum-control-platform"
version = "0.1.0"
description = "Educational quantum experiment control platform simulation"
requires-python = ">=3.12"
dependencies = ["quantum-sdk", "quantum-platform"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["sdk", "server"]

[tool.uv.sources]
quantum-sdk = { workspace = true }
quantum-platform = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-playwright>=0.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
# The SDK's wait/run take a polling timeout by design, mirroring the sync client.
ignore = ["ASYNC109"]

[tool.mypy]
strict = true
files = ["sdk/src", "server/src", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Smoke and integration tests need a running server, so the default run leaves them out.
# Run them with: uv run pytest -m "smoke or integration"
addopts = ["-m", "not smoke and not integration and not ui"]
markers = [
    "smoke: is the deployed server alive? Needs a running server (docker compose up --build --wait)",
    "integration: the real SDK against the real server. Needs a running server, like smoke",
    "ui: browser tests of the quality dashboard. Needs it running (compose.metrics.yaml)",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.isort]
known-first-party = ["quantum_sdk", "quantum_platform"]
