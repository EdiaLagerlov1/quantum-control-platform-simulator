[project]
name = "quantum-sdk"
version = "0.1.0"
description = "Python SDK for the simulated quantum experiment control platform"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantum_sdk"]
