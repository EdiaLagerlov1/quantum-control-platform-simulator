[project]
name = "quantum-platform"
version = "0.1.0"
description = "REST API and execution service for the simulated quantum experiment control platform"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "pydantic>=2.8", "uvicorn>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantum_platform"]
